name: learnio
description: "Learning with AI"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to version: 0.0.1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  tutorial_coach_mark: ^1.3.0
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  app_settings: ^5.1.0
  http: ^1.5.0
  crypto: ^3.0.6
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_colorpicker: ^1.1.0
  device_preview: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.1
  build_runner: ^2.4.0
  auto_size_text: ^3.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/language/
    - assets/config/tutorial/
    - assets/config/
    - assets/image/symbolize/
    - assets/icon/

flutter_native_splash:
  color: "#111111"
  image: assets/icon/icon.png
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  path: "assets/icon/icon.png"
